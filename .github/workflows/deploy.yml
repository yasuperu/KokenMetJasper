# Bouwt de site en zet hem op GitHub Pages (gh-pages branch)
# bij elke wijziging op main, ook als die via /admin komt.
name: Publiceer site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npx react-scripts test --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Publiceer naar gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
